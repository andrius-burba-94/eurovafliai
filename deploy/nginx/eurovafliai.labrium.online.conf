# Eurovafliai — https://eurovafliai.labrium.online
#
# Committed here and applied on the VPS by hand. The file on the box and the
# file in git must never diverge: if you change one, change the other in the
# same breath. `scripts/deploy.sh` prints a warning when they differ.
#
# Install:
#   scp deploy/nginx/eurovafliai.labrium.online.conf \
#       hstgr:/etc/nginx/sites-available/eurovafliai.labrium.online
#   ssh hstgr ln -sf /etc/nginx/sites-available/eurovafliai.labrium.online \
#                    /etc/nginx/sites-enabled/
#   ssh hstgr nginx -t && ssh hstgr systemctl reload nginx
#
# The TLS block below is added by Certbot on first issue:
#   certbot --nginx -d eurovafliai.labrium.online
#
# ## One origin, two upstreams
#
# The app is on 3007 and PocketBase on 8095, both bound to 127.0.0.1. The
# browser reaches PocketBase through `/pb/` on this same origin rather than a
# separate `-pb` subdomain (which is how the older sibling apps on this box are
# arranged). Same origin means the realtime subscription carries the session
# without any CORS or third-party-cookie question.

server {
    server_name eurovafliai.labrium.online;

    # PocketBase file uploads (avatars later); PB's own default is generous.
    client_max_body_size 10M;

    # ── PocketBase admin UI: never public ────────────────────────────────────
    # Reach it by SSH tunnel instead:
    #   ssh -L 8095:127.0.0.1:8095 hstgr   →   http://127.0.0.1:8095/_/
    #
    # Declared BEFORE /pb/ because nginx matches the longest prefix first, and
    # this must win over it.
    location /pb/_/ {
        return 403;
    }

    # ── PocketBase API + realtime ────────────────────────────────────────────
    #
    # Realtime is Server-Sent Events, and the default proxy settings kill it
    # silently — no error anywhere, the draft room simply stops updating. All
    # four directives below are load-bearing:
    #
    #   proxy_http_version 1.1   SSE needs a persistent connection; 1.0 closes it
    #   Connection ''            clears nginx's default `close`, which would end
    #                            the stream after the first event
    #   proxy_buffering off      without it nginx holds events in its buffer and
    #                            releases them in clumps, or never
    #   proxy_read_timeout 360s  an idle lobby sends nothing for minutes; the
    #                            60s default would drop the connection
    #
    # Two out of four still breaks realtime. This is the single most fragile
    # part of the whole deploy, and slice 1.3b's live lobby is the first thing
    # that would notice.
    location /pb/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;

        # Easy to forget, and the symptom is nasty: the subscription is
        # accepted but never delivers anything, because PocketBase sees an
        # anonymous request and the collection's read rules return nothing.
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── The Next.js app ──────────────────────────────────────────────────────
    #
    # Note this block DOES pass `Connection 'upgrade'`, unlike /pb/ above.
    # That is not an inconsistency: this one is for WebSocket upgrades, while
    # /pb/ needs the header empty so nginx keeps the SSE stream open.
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
    # Certbot rewrites the two lines above into a 443 server block plus an
    # HTTP→HTTPS redirect. Leave this as plain :80 in git — the committed file
    # is what you install BEFORE the certificate exists, and certbot needs a
    # working :80 vhost to answer the ACME challenge.
}
