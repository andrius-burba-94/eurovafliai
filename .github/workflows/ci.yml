name: CI

# All required PR checks share one runner and one npm install. This avoids a
# second job waiting for a hosted runner while the first has already passed.
# The full browser regression runs in browser-regression.yml at night or on demand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PB_INTERNAL_URL: http://127.0.0.1:8095
      NEXT_PUBLIC_PB_URL: http://127.0.0.1:8095
      NEXT_PUBLIC_APP_URL: http://localhost:3007
      SESSION_COOKIE_NAME: eurovafliai_session
      PB_SUPERUSER_EMAIL: ci@eurovafliai.test
      # Throwaway credentials for the PocketBase in this runner.
      PB_SUPERUSER_PASSWORD: ci-superuser-pass-1234
      # The OAuth2 migration needs provider values to assert configuration.
      # These placeholders are never used to talk to Google.
      GOOGLE_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:dead
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # API rules isolate leagues from each other, so migration and auth
      # checks remain required even though they now share this runner.
      - name: Download the pinned PocketBase
        run: ./scripts/pb-download.sh

      - name: Write .env
        # The pb:* scripts load it with --env-file, and PocketBase itself needs
        # the Google values in its own environment (pb-serve.sh sources .env
        # locally; here the job env already carries them).
        run: env | grep -E '^(PB_|NEXT_PUBLIC_|SESSION_|GOOGLE_)' > .env

      - name: Create the superuser
        run: >-
          ./pb/pocketbase superuser upsert
          "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=pb/pb_data

      - name: Boot PocketBase
        # Applies every migration from an empty database, which is itself the
        # first assertion: a fresh clone has to be able to build the schema.
        run: |
          ./pb/pocketbase serve --http=127.0.0.1:8095 \
            --dir=pb/pb_data --migrationsDir=pb/pb_migrations &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8095/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "PocketBase did not become healthy" >&2
          exit 1

      - name: PocketBase rules and indexes behave
        run: npm run pb:verify

      - name: PocketBase first-time OAuth2 sign-up still works
        run: npm run pb:verify:oauth2

      - name: PocketBase rollback and re-apply reproduce the same schema
        # `migrate down` is the path that only ever runs on the day something has
        # gone wrong, so it is the last place a surprise is welcome. Compares a
        # normalised, secret-free dump either side of reverting everything and
        # letting PocketBase re-apply it on the next boot.
        run: |
          npm run --silent pb:dump-schema > /tmp/schema-before.json
          pkill -f 'pocketbase serve'
          sleep 2
          # printf, not `yes`: under pipefail a looping `yes` takes SIGPIPE when
          # PocketBase exits and the non-zero status would fail the step.
          printf 'y\n' | ./pb/pocketbase migrate down "$(ls pb/pb_migrations/*.js | wc -l)" \
            --dir=pb/pb_data --migrationsDir=pb/pb_migrations
          ./pb/pocketbase serve --http=127.0.0.1:8095 \
            --dir=pb/pb_data --migrationsDir=pb/pb_migrations &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8095/api/health >/dev/null && break
            sleep 1
          done
          npm run --silent pb:dump-schema > /tmp/schema-after.json
          diff -u /tmp/schema-before.json /tmp/schema-after.json
